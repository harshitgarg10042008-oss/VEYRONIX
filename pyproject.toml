[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configsentinel-sdk"
version = "0.3.0"
description = "Evidence-grounded, vendor-neutral network compliance SDK"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VEYRONIX Team"}]
license = {text = "Proprietary hackathon prototype"}
keywords = ["network-security", "compliance", "configuration-audit", "cybersecurity", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
backup = ["cryptography>=42.0"]

[project.urls]
Homepage = "https://github.com/harshitgarg10042008-oss/VEYRONIX"
Repository = "https://github.com/harshitgarg10042008-oss/VEYRONIX"
Documentation = "https://github.com/harshitgarg10042008-oss/VEYRONIX/tree/main/docs"

[project.scripts]
configsentinel = "configsentinel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

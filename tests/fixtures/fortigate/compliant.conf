config system global
    set alias SIH-FGT-COMPLIANT
    set admin-telnet disable
    set admin-https enable
    set admin-ssh-port 22
    set admintimeout 10
    set syslog-server 10.0.0.20
    set ntpserver "10.0.0.1"
    set password-policy minimum-length 14
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set trusthost1 192.168.1.0/24
        set password ENC FAKEHASHVALUE==
    next
end
config system snmp sentry
    edit 1
        set status enable
    next
end

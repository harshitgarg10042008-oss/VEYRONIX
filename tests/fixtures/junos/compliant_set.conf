# Junos SET form — compliant
set system host-name SIH-JUNOS-COMPLIANT
set system authentication-order [ tacplus password ]
set system tacplus-server 10.0.0.5 secret FAKEKEY123
set system login password minimum-length 14
set system login class OPERATOR permissions view
set system login class ADMIN permissions all
set system services ssh protocol-version v2
delete system services telnet
set system services web-management https system-generated-certificate
set system syslog host 10.0.0.20 any info
set system syslog host 10.0.0.20 authorization info
set system ntp server 10.0.0.1
set system ntp authentication-key 1 type md5 value FAKEKEY
set snmp v3 usm local-engine user MONITOR authentication-sha authentication-password AUTHKEY
set snmp v3 usm local-engine user MONITOR privacy-aes128 privacy-password PRIVKEY

! COMPLIANT Cisco IOS — passes all applicable controls
! Owner: network-ops@example.com | Team: Network Security | Review: 2026-Q4
version 17.9
hostname SIH-ROUTER-COMPLIANT
!
service password-encryption
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
!
username breakglass privilege 15 secret 9 $9$fakehashonly
!
security password min-length 14
!
ntp server 10.0.0.1 key 1
ntp authentication-key 1 md5 FAKEKEY123
ntp authenticate
!
logging host 10.0.0.20
logging trap informational
!
snmp-server group SECURE-GROUP v3 priv
snmp-server user MONITOR SECURE-GROUP v3 auth sha AUTHKEY123 priv aes 128 PRIVKEY123
!
ip ssh version 2
ip ssh dh-min-size 2048
ip ssh time-out 60
!
no ip http server
ip http secure-server
!
no cdp run
no service pad
!
ip verify unicast source reachable-via rx
!
archive
 log config
  logging enable
  notify syslog contenttype plaintext
  hidekeys
!
line vty 0 4
 transport input ssh
 access-class MGMT-ACL in
 exec-timeout 10 0
!
access-list 10 permit 192.168.1.0 0.0.0.255
access-list 10 deny   any
ip access-list standard MGMT-ACL
 permit 192.168.1.0 0.0.0.255
 deny   any log
!
end

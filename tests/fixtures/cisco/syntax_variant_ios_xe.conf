! IOS-XE Syntax variant — additional IOS-XE specific markers
version 17.3
hostname SIH-IOS-XE
!
service password-encryption
!
aaa new-model
!
restconf
netconf-yang
!
ip ssh version 2
!
no ip http server
ip http secure-server
ip http authentication local
!
ntp server vrf MGMT 10.0.0.1
!
logging host 10.0.0.20 transport udp port 514
!
end

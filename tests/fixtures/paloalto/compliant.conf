set deviceconfig system hostname SIH-PANOS-COMPLIANT
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system permitted-ip 192.168.1.0/24
set deviceconfig system ntp-servers primary 10.0.0.1
set mgt-config password-complexity enabled yes
set mgt-config password-complexity minimum-length 14
set deviceconfig system ssl-tls-service-profile default

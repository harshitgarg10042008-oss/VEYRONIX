! COMPLIANT Arista EOS — management API, SSH, NTP, logging
! Owner: arista-ops@example.com
hostname SIH-ARISTA-COMPLIANT
!
management api http-commands
   protocol https
   no shutdown
!
ip ssh version 2
!
line vty 0 4
 transport input ssh
!
aaa new-model
!
ntp server 10.0.0.1
!
logging host 10.0.0.20
!
snmp-server group SECGRP v3 priv
!
no ip http server
!
end

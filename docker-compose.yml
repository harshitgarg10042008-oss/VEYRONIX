version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - VEYRONIX_API_HOST=0.0.0.0
      - VEYRONIX_API_PORT=5000
    volumes:
      # Mount a local data directory for persistent ledgers/backups if needed
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Optional explicit API URL, usually Vite handles it via proxy /api in preview mode
      - VITE_API_URL=http://backend:5000

name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=src python -m pytest -q
      - run: PYTHONPATH=src python -m compileall -q src tests examples
      - run: PYTHONPATH=src python -m configsentinel.cli release-manifest . --out release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: configsentinel-release-manifest
          path: release-manifest.json

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python backend ─────────────────────────────────────────────
  python-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev,backup]"

      - name: Run tests
        run: python -m pytest -v

      - name: Compile-check source
        run: python -m compileall -q src tests examples

      - name: Check no secrets in diff
        run: git diff --check || true

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

  # ── Frontend ───────────────────────────────────────────────────
  frontend-check:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Build frontend
        run: pnpm run build

  # ── End-to-end tests (Playwright) ─────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [python-test, frontend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        run: pnpm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
          CONFIGSENTINEL_AUTH_REQUIRED: "false"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VEYRONIX — ConfigSentinel AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #1E3A8A;
            color: #F0F9FF;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 80px;
        }
        .accent-line {
            position: absolute;
            width: 300px;
            height: 2px;
            background: #FACC15;
            transform: rotate(-45deg);
            top: 100px;
            left: -50px;
        }
        .header-container {
            max-width: 900px;
        }
        h1 {
            font-size: 84px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 0.9;
            margin-bottom: 20px;
            text-align: left;
        }
        .subtitle-box {
            border: 4px solid #FACC15;
            padding: 20px;
            display: inline-block;
            margin-top: 20px;
        }
        .subtitle {
            font-size: 28px;
            font-weight: 500;
            color: #FACC15;
        }
        .footer-info {
            position: absolute;
            bottom: 60px;
            left: 80px;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(240, 249, 255, 0.7);
        }
        .team-info {
            position: absolute;
            bottom: 60px;
            right: 80px;
            text-align: right;
            font-size: 24px;
            font-weight: 900;
            color: #FACC15;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-line"></div>
        <div class="header-container">
            <h1>VEYRONIX<br>CONFIGSENTINEL AI</h1>
            <div class="subtitle-box">
                <p class="subtitle">Evidence-grounded, vendor-neutral network security compliance</p>
            </div>
        </div>
        <div class="footer-info">
            Smart India Hackathon 2026 | Software | Problem Statement 26155
        </div>
        <div class="team-info">
            TEAM VEYRONIX
        </div>
    </div>
</body>
</html>
